name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sms, POSTGRES_PASSWORD: sms, POSTGRES_DB: sms_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-retries 10
    env:
      SMS_TEST_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: SMS_DATABASE_URL=$SMS_TEST_DATABASE_URL alembic upgrade head
