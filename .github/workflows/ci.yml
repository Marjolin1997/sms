name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # gjerësisht i gjerë: s'ka ende kohë reale CI (sharding i shtyrë)
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sms, POSTGRES_PASSWORD: sms, POSTGRES_DB: sms_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-retries 10
    env:
      SMS_TEST_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_test
      PGPASSWORD: sms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Static security scan (bandit, medium+)
        run: pip install bandit && bandit -q -r app apps -ll
      - name: Tests on PostgreSQL
        run: pytest -q
      - name: Tests on SQLite (dev fallback)
        run: env -u SMS_TEST_DATABASE_URL pytest -q
      - name: Migrations up / down / up on a clean database
        env:
          SMS_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_migrate
        run: |
          psql -h localhost -U sms -d postgres -c "create database sms_migrate"
          # një kokë e vetme; pas upgrade, DB është saktësisht në atë kokë (pa e ngulitur numrin këtu)
          test "$(alembic heads | wc -l)" = "1"
          alembic upgrade head
          test "$(alembic current | cut -d' ' -f1)" = "$(alembic heads | cut -d' ' -f1)"
          alembic downgrade base
          alembic upgrade head
          test "$(alembic current | cut -d' ' -f1)" = "$(alembic heads | cut -d' ' -f1)"
      - name: Central migrations on a clean PostgreSQL database (head 0031)
        env:
          CENTRAL_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_central_migrate
        run: |
          psql -h localhost -U sms -d postgres -c "create database sms_central_migrate"
          test "$(alembic -c apps/central/alembic.ini heads | cut -d' ' -f1)" = "0031"
          alembic -c apps/central/alembic.ini upgrade head
          test "$(alembic -c apps/central/alembic.ini current | cut -d' ' -f1)" = "0031"
      - name: Backup, restore and ledger verification round-trip
        env:
          SMS_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_migrate
          SMS_PII_HMAC_KEY: ci-only-hmac-key-0123456789abcdef0123456789
        run: |
          DATABASE_URL=postgresql://sms:sms@localhost:5432/sms_migrate BACKUP_DIR=/tmp/bk scripts/backup.sh
          ADMIN_URL=postgresql://sms:sms@localhost:5432/postgres scripts/restore.sh /tmp/bk/sms-*.dump sms_restored
          SMS_DATABASE_URL=postgresql+psycopg://sms:sms@localhost:5432/sms_restored python -m scripts.verify_ledger

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Component and unit tests (Vitest)
        run: npm test
      - name: i18n coverage + production build
        run: npm run build

  frontend-central:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend-central}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend-central/package-lock.json}
      - run: npm ci
      - name: Component and unit tests (Vitest)
        run: npm test
      - name: i18n coverage + production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sms, POSTGRES_PASSWORD: sms, POSTGRES_DB: sms_e2e}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-retries 10
    env:
      SMS_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_e2e
      SMS_PII_HMAC_KEY: ci-only-hmac-key-0123456789abcdef0123456789
      SMS_SECRETS_KEY: wV0dVQ1nH7xk2m3bYw0m8y7QbKpZ0o1o9mGQ0mF0dJQ=
      SMS_ADMIN_API_KEY: ci-bootstrap-key
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-out/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements-dev.txt playwright
      - run: playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: alembic upgrade head
      - name: Seed demo data and start the stack
        run: |
          mkdir -p e2e-out/logs e2e-out/artifacts
          python -m scripts.seed_demo > seed.out
          uvicorn app.main:app --port 8000 > e2e-out/logs/api.log 2>&1 &
          (cd frontend && npx vite --port 5173 --host 127.0.0.1 > ../e2e-out/logs/vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && curl -sf localhost:5173 >/dev/null && break; sleep 1; done
      - name: Browser end-to-end test
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          export E2E_CLIENT_KEY=$(sed -n 's/^CLIENT_KEY=//p' seed.out)
          export E2E_ADMIN_KEY=$(sed -n 's/^ADMIN_KEY=//p' seed.out)
          python e2e/test_console.py 2>&1 | tee e2e-out/logs/test_console.out
      # vetëm logje + pamje ekrani (asnjë seed.out/.env/DB: përmbajnë çelësa të përkohshëm)
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-enterprise-failure
          path: |
            e2e-out/logs
            e2e-out/artifacts
          retention-days: 7
          if-no-files-found: ignore

  central-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate i përkohshëm JO-bllokues, deri në 3 ekzekutime radhazi të gjelbra në GitHub CI
    # (pa flake nisjeje/shfletuesi, kohë e pranueshme). Pastaj hiqet `continue-on-error`.
    continue-on-error: true
    # Vetëm SQLite i përkohshëm, kredenciale sintetike të gjeneruara, uvicorn + Vite lokalë, Chromium;
    # asnjë provider/SMTP/pagesë dhe asnjë sekret i repo-s (e2e/run_central_e2e.sh e imponon me roje).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend-central/package-lock.json}
      - run: pip install -r requirements-dev.txt playwright
      - run: playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend-central
      - name: Central browser E2E (console + audit)
        env:
          E2E_OUT: ${{ runner.temp }}/central-e2e
        run: e2e/run_central_e2e.sh
      # vetëm logje + pamje ekrani; kurrë DB, çelës apo ids.json (direktoria work/)
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-central-failure
          path: |
            ${{ runner.temp }}/central-e2e/logs
            ${{ runner.temp }}/central-e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # VETËM peme aktuale e checkout-it (pa histori, pa fetch-depth: 0). Histori e plotë = detyrë manuale e shtyrë.
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          V=8.21.2
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan current tree (values redacted)
        run: ./gitleaks dir . --no-banner --redact -c .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API/worker image and smoke-test it
        run: |
          docker build -t sms-api .
          docker run --rm -e SMS_DATABASE_URL=sqlite:////tmp/smoke.db sms-api python -c "from app.main import app; print('import ok')"
          docker run --rm sms-api python -m scripts.worker_health 1 || echo "worker_health correctly fails when no worker runs"
      - name: Build Central image (target central) and smoke-test it
        run: |
          docker build --target central -t sms-central .
          docker run --rm -e CENTRAL_DATABASE_URL=sqlite:////tmp/smoke.db sms-central python -c "from apps.central.main import app; print('import ok')"
          test "$(docker run --rm sms-central id -u)" = "10001"
          # çdo komandë e dokumentuar si e ekzekutueshme brenda imazhit Central (inventari te docs/RUNBOOK.md §8)
          for m in $(sed -n '/central-image-commands:start/,/central-image-commands:end/p' docs/RUNBOOK.md | grep -oE 'apps\.central\.tools\.[a-z_]+'); do
            docker run --rm sms-central python -m "$m" --help > /dev/null || { echo "FAILED in Central image: $m"; exit 1; }
          done
      - name: Build web images (Enterprise and Central consoles + nginx)
        run: |
          docker build -f deploy/web.Dockerfile -t sms-web .
          docker build -f deploy/web-central.Dockerfile -t sms-web-central .
      - name: nginx configurations are valid
        run: |
          docker run --rm --add-host api:127.0.0.1 sms-web nginx -t
          docker run --rm --add-host central-api:127.0.0.1 sms-web-central nginx -t
      - name: Edge proxy behaviour on real nginx (real_ip, XFF/Proto, headers, 429, webhooks, health, /internal)
        run: EDGE_WEB_IMAGE=sms-web EDGE_CENTRAL_WEB_IMAGE=sms-web-central python3 e2e/edge/check_edge.py
      - name: Production compose renders (templates only, no secrets)
        run: |
          cp .env.example .env
          # nisja e zakonshme = vetëm Enterprise: NUK kërkon .env.central
          docker compose -f docker-compose.prod.yml --env-file .env config -q
          test "$(docker compose -f docker-compose.prod.yml --env-file .env config --services | sort | tr '\n' ' ')" = "api db migrate web webhook-worker worker "
          # Central është opt-in dhe kërkon mjedisin e vet kur aktivizohet
          if docker compose -f docker-compose.prod.yml --env-file .env --profile central config -q 2>/dev/null; then echo "central profile must require .env.central"; exit 1; fi
          cp .env.central.example .env.central
          docker compose -f docker-compose.prod.yml --env-file .env --profile central config -q
          docker compose -f docker-compose.prod.yml --env-file .env --profile central-jobs --profile sender config -q

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # këshillues: raporton dobësi të njohura, nuk bllokon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
