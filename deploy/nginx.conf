# Nginx para API-së. TLS përfundohet këtu ose në load balancer-in para tij; shih docs/RUNBOOK.md.
# X-Forwarded-For SHKRUHET (jo shtohet) me IP-në e lidhjes: pra SMS_TRUSTED_PROXY_HOPS=1 është i saktë
# dhe klienti s'mund ta falsifikojë. Nëse ka edhe një load balancer para këtij nginx, vendosni
# real_ip_header/set_real_ip_from për rrjetin e tij dhe SMS_TRUSTED_PROXY_HOPS=1 mbetet i vlefshëm.
upstream api { server api:8000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 512k;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # SPA: skripte vetëm nga vetja; stile inline (React style=) lejohen; lidhje vetëm me origjinën
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  location = /nginx-health { access_log off; return 200 "ok"; }

  # API, faqet publike (çregjistrimi) dhe callback-et e provider-ave (/webhooks/*: DLR, Twilio, pagesa)
  location ~ ^/(v1|u|healthz|readyz)(/|$) {
    limit_req zone=perip burst=60 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  # Skedarët me hash të Vite: cache i gjatë; index.html asnjëherë
  location /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
