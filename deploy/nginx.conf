# Nginx i Enterprise (M11-I/F-02): origjinë HTTP-only (port 8080, loopback në compose) pas një TLS terminator/LB/WAF të jashtëm.
#
# TLS, ridrejtimi HTTP->HTTPS dhe HSTS ZOTËROHEN nga terminatori i TLS, jo nga ky nginx: këtu NUK ka TLS dhe NUK dërgohet HSTS
# (proxy_hide_header heq çdo HSTS që do të vinte nga aplikacioni). HSTS aktivizohet te terminatori pasi HTTPS të provohet.
#
# IP e klientit: `real_ip` vlen VETËM nga proxy-t e besuara të dhëna nga operatori (EDGE_TRUSTED_PROXY_CIDRS -> /etc/nginx/trusted_proxies.conf;
# parazgjedhja: asnjë). Pas real_ip, `$remote_addr` = klienti real dhe te aplikacioni shkon një X-Forwarded-For i vetëm i normalizuar
# (SMS_TRUSTED_PROXY_HOPS=1). X-Forwarded-Proto është `https` vetëm kur kërkesa vjen nga një proxy i besuar që e ka deklaruar; ndryshe `http`.
#
# Header-at: `add_header` në një location ZËVENDËSON (nuk trashëgon) atë të serverit, ndaj çdo location me add_header të vetin e përsërit
# bashkësinë e plotë. Statikja (/, /assets/) dhe gabimet e gjeneruara nga nginx marrin bashkësinë SPA (CSP e plotë). Përgjigjet e aplikacionit
# (API, /webhooks, /u) i zotëron aplikacioni (CSP/nosniff/referrer/no-store); nginx shton vetëm X-Frame-Options dhe Permissions-Policy.
upstream api { server api:8000; keepalive 16; }

# Kufizim për klientët e API-së dhe zonë e VEÇANTË, më e gjerë, për callback-et e provider-ave (batch-e legjitime nga IP të pakta).
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hooks:10m rate=200r/s;

# A është peer-i i lidhjes (para real_ip) një proxy i besuar? (skedari gjenerohet nga edge-cidrs.sh)
geo $realip_remote_addr $from_trusted_proxy {
  default 0;
  include /etc/nginx/trusted_proxies_geo.conf;
}
# X-Forwarded-Proto i besuar: vetëm nga proxy i besuar që deklaron https; një klient publik s'mund ta falsifikojë.
map "$from_trusted_proxy:$http_x_forwarded_proto" $edge_proto {
  default http;
  "~^1:https(,|$)" https;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 512k;
  limit_req_status 429;

  include /etc/nginx/trusted_proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # Bashkësia SPA (për përgjigje pa add_header të vetin, p.sh. /nginx-health). Pa HSTS (e zotëron terminatori i TLS).
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  # Gabimet e gjeneruara nga nginx marrin bashkësinë SPA të plotë (statusi origjinal ruhet nga `return`).
  error_page 403 @e403;
  error_page 404 @e404;
  error_page 413 @e413;
  error_page 429 @e429;
  error_page 502 @e502;
  error_page 503 @e503;
  error_page 504 @e504;

  # Gjallëria e nginx për LB-në/terminatorin (nuk prek aplikacionin).
  location = /nginx-health { access_log off; return 200 "ok"; }

  # /healthz dhe /readyz: VETËM brenda (loopback + EDGE_INTERNAL_ALLOW_CIDRS); publikisht 403. /readyz mund të zbulojë arsye të brendshme.
  location ~ ^/(healthz|readyz)$ {
    include /etc/nginx/internal_allow.conf;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    proxy_read_timeout 10s;
  }

  # Callback-et e provider-ave: autentikimi mbetet nënshkrimi (HMAC / X-Twilio-Signature mbi URL-në publike). Path-i dhe query ruhen
  # (proxy_pass pa URI). Zonë kufizimi e veçantë, jo e klientëve.
  location ~ ^/webhooks(/|$) {
    limit_req zone=hooks burst=400 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    proxy_read_timeout 60s;
  }

  # API e klientëve dhe faqet publike (çregjistrimi)
  location ~ ^/(v1|u)(/|$) {
    limit_req zone=perip burst=60 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    proxy_read_timeout 60s;
  }

  # Skedarët me hash të Vite: cache i gjatë. Bashkësia SPA përsëritet (add_header në location zëvendëson atë të serverit).
  location /assets/ {
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA (index.html + fallback): asnjëherë në cache
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store";
  }

  # Faqet e gabimeve të nginx (bashkësia SPA; `return` ruan kodin origjinal). 429 = kufizim real i shpejtësisë.
  location @e403 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 403 '{"detail":"forbidden"}'; }
  location @e404 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 404 '{"detail":"not found"}'; }
  location @e413 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 413 '{"detail":"payload too large"}'; }
  location @e429 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; add_header Retry-After 1 always; return 429 '{"detail":"too many requests"}'; }
  location @e502 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 502 '{"detail":"bad gateway"}'; }
  location @e503 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 503 '{"detail":"service unavailable"}'; }
  location @e504 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 504 '{"detail":"gateway timeout"}'; }
}
