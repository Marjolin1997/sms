# Nginx para API-së CENTRAL dhe konsolës së stafit Central (M11-I/F-01). HTTP i thjeshtë (port 8081, vetëm 127.0.0.1 në compose).
# TLS përfundon JASHTË (load balancer/proxy i prodhimit): këtu NUK ka TLS dhe NUK dërgohet HSTS (do të dërgohej mbi HTTP të thjeshtë).
# Hartimi i TLS/HSTS dhe i `CENTRAL_TRUSTED_PROXY_HOPS` në topologjinë reale është blloku i veçantë "TLS / reverse proxy" (shih docs/m11i-*).
#
# Rrugëzimi (qëllimisht i ngushtë): /auth, /admin, /healthz, /readyz -> central-api:8001. ASNJË proxy te Enterprise:
# /v1, /webhooks, /u, /internal, /registration kthejnë 404 këtu. Gjithçka tjetër është SPA (index.html).
# X-Forwarded-For SHKRUHET (jo shtohet) me IP-në e lidhjes: me një nginx të vetëm CENTRAL_TRUSTED_PROXY_HOPS=1 është i saktë
# dhe klienti s'mund ta falsifikojë. Me një load balancer para këtij nginx duhet real_ip_header/set_real_ip_from (blloku i proxy-t).
upstream central_api { server central-api:8001; keepalive 8; }

limit_req_zone $binary_remote_addr zone=central_auth:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=central_admin:10m rate=30r/s;

server {
  listen 8081;
  server_name _;
  server_tokens off;
  client_max_body_size 256k;
  limit_req_status 429;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  # SPA: skripte vetëm nga vetja; stile inline (React style=) lejohen; lidhje vetëm me origjinën. (Pa HSTS: shih më sipër.)
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  location = /nginx-health { access_log off; return 200 "ok"; }

  # Familjet e API-ve që NUK i përkasin konsolës Central: refuzim i qartë (jo SPA, jo proxy).
  location ~ ^/(v1|webhooks|u|internal|registration)(/|$) { return 404; }

  # Hyrja e stafit: kufizim më i ngushtë kundër provave me fjalëkalim
  location ~ ^/auth(/|$) {
    limit_req zone=central_auth burst=10 nodelay;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  # API-ja admin/operator dhe pikat e shëndetit të Central
  location ~ ^/(admin(/|$)|healthz$|readyz$) {
    limit_req zone=central_admin burst=60 nodelay;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
  }

  # Skedarët me hash të Vite: cache i gjatë; index.html asnjëherë
  # `add_header` në një location ZËVENDËSON (nuk trashëgon) header-at e nivelit server: ato përsëriten këtu qëllimisht.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store";
  }
}
