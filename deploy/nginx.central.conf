# Nginx i CENTRAL (M11-I/F-02): origjinë HTTP-only pas një TLS terminator/LB/WAF të jashtëm. Dy listener-a:
#   8081  sipërfaqja PUBLIKE e stafit Central: /auth, /admin + SPA. NUK ruton /internal, /v1, /webhooks, /u, /registration (404).
#   8082  listener i BRENDSHËM Enterprise->Central: vetëm /internal/* (sinkron, para, çmime, faturim, sender), me allowlist rrjeti
#         (EDGE_S2S_ALLOW_CIDRS; parazgjedhja: askush). Autentikimi i kërkesave mbetet nënshkrimi i shërbimit (Ed25519) i Central.
# Terminatori i TLS e ekspozon 8082 vetëm si emër/rrugë të brendshme (p.sh. central-internal.<domen>), jo në Internet.
#
# TLS, ridrejtimi HTTP->HTTPS dhe HSTS ZOTËROHEN nga terminatori i TLS: këtu s'ka TLS dhe s'dërgohet HSTS (proxy_hide_header e heq nëse vjen nga lart).
# IP e klientit: `real_ip` vetëm nga proxy-t e besuara të operatorit (EDGE_TRUSTED_PROXY_CIDRS; parazgjedhja: asnjë); te Central shkon një
# X-Forwarded-For i vetëm i normalizuar (CENTRAL_TRUSTED_PROXY_HOPS=1). X-Forwarded-Proto=https vetëm nga proxy i besuar që e deklaron.
# `add_header` në location zëvendëson atë të serverit: çdo location me add_header të vetin përsërit bashkësinë e plotë.
# Central s'ka middleware sigurie: nginx zotëron header-at e API-së (nosniff, CSP e ngushtë, no-store). Regjistrimi publik mbetet i mbyllur;
# hapja e tij kërkon /registration me client_max_body_size 4k + limit_req (docs/M8_REGISTRATION.md) dhe CENTRAL_PUBLIC_REGISTRATION_PROXY_ACK.
upstream central_api { server central-api:8001; keepalive 8; }

limit_req_zone $binary_remote_addr zone=central_auth:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=central_admin:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=central_internal:1m rate=30r/s;

geo $realip_remote_addr $from_trusted_proxy {
  default 0;
  include /etc/nginx/trusted_proxies_geo.conf;
}
map "$from_trusted_proxy:$http_x_forwarded_proto" $edge_proto {
  default http;
  "~^1:https(,|$)" https;
}

# ---------------------------------------------------------------- sipërfaqja publike e stafit
server {
  listen 8081;
  server_name _;
  server_tokens off;
  client_max_body_size 256k;
  limit_req_status 429;

  include /etc/nginx/trusted_proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  error_page 403 @e403;
  error_page 404 @e404;
  error_page 413 @e413;
  error_page 429 @e429;
  error_page 502 @e502;
  error_page 503 @e503;
  error_page 504 @e504;

  location = /nginx-health { access_log off; return 200 "ok"; }

  # Familjet e API-ve që NUK i përkasin konsolës publike: refuzim i qartë (jo SPA, jo proxy). /internal është VETËM te listener-i 8082.
  location ~ ^/(v1|webhooks|u|internal|registration)(/|$) { return 404; }

  # /healthz dhe /readyz: vetëm brenda (loopback + EDGE_INTERNAL_ALLOW_CIDRS); publikisht 403. /readyz zbulon arsye të brendshme.
  location ~ ^/(healthz|readyz)$ {
    include /etc/nginx/internal_allow.conf;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 10s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
  }

  # Hyrja e stafit: kufizim më i ngushtë kundër provave me fjalëkalim
  location ~ ^/auth(/|$) {
    limit_req zone=central_auth burst=10 nodelay;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
  }

  # API-ja admin/operator
  location ~ ^/admin(/|$) {
    limit_req zone=central_admin burst=60 nodelay;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store";
  }

  location @e403 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 403 '{"detail":"forbidden"}'; }
  location @e404 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 404 '{"detail":"not found"}'; }
  location @e413 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 413 '{"detail":"payload too large"}'; }
  location @e429 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; add_header Retry-After 1 always; return 429 '{"detail":"too many requests"}'; }
  location @e502 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 502 '{"detail":"bad gateway"}'; }
  location @e503 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 503 '{"detail":"service unavailable"}'; }
  location @e504 { default_type application/json; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 504 '{"detail":"gateway timeout"}'; }
}

# ---------------------------------------------------------------- listener i BRENDSHËM Enterprise -> Central
server {
  listen 8082;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;
  limit_req_status 429;

  include /etc/nginx/trusted_proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-store" always;

  error_page 403 @i403;
  error_page 429 @i429;
  error_page 502 @i502;
  error_page 504 @i504;

  location = /nginx-health { access_log off; return 200 "ok"; }

  # Vetëm rrugët e shërbimit; allowlist rrjeti PARA çdo proxy (autentikimi i nënshkruar mbetet autoritativ te Central).
  location ~ ^/internal(/|$) {
    include /etc/nginx/s2s_allow.conf;
    limit_req zone=central_internal burst=60 nodelay;
    proxy_pass http://central_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
  }

  # Gjithçka tjetër (përfshirë /auth, /admin, /healthz, /readyz, SPA): jo këtu.
  location / { return 404; }

  location @i403 { default_type application/json; return 403 '{"detail":"forbidden"}'; }
  location @i429 { default_type application/json; add_header Retry-After 1 always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; add_header Cache-Control "no-store" always; return 429 '{"detail":"too many requests"}'; }
  location @i502 { default_type application/json; return 502 '{"detail":"bad gateway"}'; }
  location @i504 { default_type application/json; return 504 '{"detail":"gateway timeout"}'; }
}
