services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sms_dev
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
    ports: ["127.0.0.1:5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_dev"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      SMS_DATABASE_URL: postgresql+psycopg://sms:sms@db:5432/sms_dev
      SMS_ADMIN_API_KEY: dev-admin-key
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    environment:
      SMS_DATABASE_URL: postgresql+psycopg://sms:sms@db:5432/sms_dev
    depends_on:
      db: {condition: service_healthy}
    command: python -m app.worker
volumes:
  dbdata:
