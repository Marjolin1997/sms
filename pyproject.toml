[project]
name = "sms-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "cryptography>=42",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "dkimpy>=1.1",
  "dnspython>=2.4",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # Depends() në default është idioma e FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I", "UP"]
"apps/central/migrations/versions/*" = ["E501"]
"apps/central/services/registrations.py" = ["E501"]
"apps/central/services/provisioning.py" = ["E501"]
"apps/central/api/registration_public.py" = ["E501"]
"apps/central/api/registration_admin.py" = ["E501"]
"apps/central/tools/reconcile_registrations.py" = ["E501"]
"tests/*" = ["E501"]
"tests/test_central_assignments.py" = ["F811"]  # fixtures të importuara
"apps/central/services/service_auth.py" = ["E501"]
"apps/central/models/service_auth.py" = ["E501"]
"apps/central/services/sync_feed.py" = ["E501"]
"apps/central/api/internal_sync.py" = ["E501"]
"apps/central/tools/bootstrap_enterprise_products.py" = ["E501"]
"apps/central/tools/backfill_assignment_rate_limits.py" = ["E501"]
"tests/test_central_sync_outbox.py" = ["F811"]  # fixtures të importuara
"tests/test_control_plane_contract.py" = ["F811"]  # fixtures të importuara
"app/services/invoice_render.py" = ["E501"]
"app/core/openapi.py" = ["E501"]
"scripts/bench.py" = ["E501"]
"scripts/bench_probe.py" = ["E501"]
"scripts/bench_ab.py" = ["E501"]
"scripts/backfill_enterprise_id.py" = ["E501"]
"scripts/enterprises_audit.py" = ["E501"]
"app/services/enterprises.py" = ["E501"]
"app/core/tenancy.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*", "apps*", "packages*"]
