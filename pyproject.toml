[project]
name = "sms-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "pymysql>=1.1",
  "cryptography>=42",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # Depends() në default është idioma e FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
