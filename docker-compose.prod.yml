# Prodhim (një host): docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# .env krijohet nga .env.example (SEKRETE TË VËRTETA, kurrë në git). Shih docs/RUNBOOK.md.
x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    SMS_ENV: production
    SMS_DATABASE_URL: postgresql+psycopg://sms:${POSTGRES_PASSWORD}@db:5432/sms
    SMS_TRUSTED_PROXY_HOPS: "1"
  depends_on:
    db: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 5s
      retries: 20
    # asnjë port i publikuar: vetëm rrjeti i brendshëm i compose

  migrate:
    build: .
    env_file: .env
    environment:
      SMS_ENV: production
      SMS_DATABASE_URL: postgresql+psycopg://sms:${POSTGRES_PASSWORD}@db:5432/sms
    depends_on:
      db: {condition: service_healthy}
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--workers", "2"]

  worker:
    <<: *app
    command: python -m app.worker
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_health", "90"]
      interval: 30s
      start_period: 30s

  webhook-worker:
    <<: *app
    command: python -m app.worker --role webhooks
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_health", "90"]
      interval: 30s
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]  # vendose TLS/load balancer përpara këtij porti

volumes:
  dbdata:
